<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet Toolkit — VLSM & CIDR Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & root vars ─────────────────────────────────────────────── */
        :root {
            --bg:       #050a14;
            --surface:  #0a1628;
            --surface2: #0d1f38;
            --border:   #1a3a5c;
            --text:     #c8d8f0;
            --muted:    #4a6a8a;
            --accent:   #00e5ff;
            --accent2:  #7b61ff;
            --hot:      #ff3a6e;
            --green:    #2dffb3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 48px;
            position: relative;
            overflow-x: hidden;
        }

        /* Grid bg */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(0,160,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,160,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        /* Scanlines */
        body::after {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
            );
            pointer-events: none;
        }

        .wrapper { position: relative; z-index: 1; width: 100%; max-width: 980px; }

        /* ── Site header ──────────────────────────────────────────────────── */
        .site-header { text-align: center; margin-bottom: 28px; }

        .site-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(1.5rem, 5vw, 2.8rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, #00e5ff 0%, #7b61ff 50%, #ff3a6e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .site-sub {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.12em;
        }

        /* ── Tab nav ──────────────────────────────────────────────────────── */
        .tab-nav {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--surface);
        }

        .tab-btn {
            flex: 1;
            font-family: 'Orbitron', monospace;
            font-size: clamp(0.6rem, 2vw, 0.78rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 14px 10px;
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            text-align: center;
        }

        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: transparent;
            transition: background 0.25s;
        }

        .tab-btn:hover { color: var(--text); }

        .tab-btn.active[data-tab="vlsm"] {
            color: var(--accent);
            background: rgba(0,229,255,0.06);
        }
        .tab-btn.active[data-tab="vlsm"]::after { background: var(--accent); }

        .tab-btn.active[data-tab="cidr"] {
            color: var(--green);
            background: rgba(45,255,179,0.06);
        }
        .tab-btn.active[data-tab="cidr"]::after { background: var(--green); }

        .tab-divider {
            width: 1px;
            background: var(--border);
            align-self: stretch;
        }

        /* ── Tab panels ───────────────────────────────────────────────────── */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Shared control styles ────────────────────────────────────────── */
        .panel-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 14px;
        }

        .ctrl-label {
            font-size: 0.66rem;
            letter-spacing: 0.14em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        .grow { flex: 1; min-width: 200px; }

        /* sliders */
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .slider-val {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%; height: 6px;
            background: var(--border);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(0,229,255,0.35);
            cursor: pointer;
        }

        .tick-row {
            display: flex; justify-content: space-between;
            margin-top: 5px; padding: 0 2px;
        }
        .tick { font-size: 0.58rem; color: var(--muted); opacity: 0.5; }

        /* Buttons */
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }

        .btn {
            font-family: 'Orbitron', monospace;
            font-size: 0.66rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            padding: 9px 16px; border: none; border-radius: 4px;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }
        .btn-cyan {
            background: transparent; color: var(--accent);
            border: 1px solid var(--accent);
            box-shadow: 0 0 8px rgba(0,229,255,0.2);
        }
        .btn-cyan:hover { background: rgba(0,229,255,0.1); box-shadow: 0 0 16px rgba(0,229,255,0.5); }

        .btn-red {
            background: transparent; color: var(--hot);
            border: 1px solid var(--hot);
            box-shadow: 0 0 8px rgba(255,58,110,0.2);
        }
        .btn-red:hover { background: rgba(255,58,110,0.1); box-shadow: 0 0 16px rgba(255,58,110,0.5); }

        /* octet inputs */
        .net-row { display: flex; gap: 5px; align-items: center; justify-content: center; }
        .net-input {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            background: #060d1a;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            padding: 8px 6px;
            outline: none;
            width: 52px;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .net-input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,229,255,0.25); }
        .net-input.error { border-color: var(--hot); box-shadow: 0 0 10px rgba(255,58,110,0.3); }
        .net-sep { color: var(--muted); font-size: 1.1rem; padding: 0 1px; }

        /* Info badge strip */
        .info-strip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex; flex-wrap: wrap; gap: 24px;
            align-items: center; justify-content: center;
            font-size:
